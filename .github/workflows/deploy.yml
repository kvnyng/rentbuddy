name: Deploy

# Production: every push to main deploys the `rentbuddy` Worker (rentbuddy.pablos.cc).
# Preview: every PR uploads a version of the separate `rentbuddy-preview` Worker
# (Clerk development instance) under a stable alias, and comments the URL.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # A production deploy must never be skipped silently.
      - name: Require CLOUDFLARE_API_TOKEN
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set; production was NOT deployed."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rentbuddy/web build
      - run: pnpm exec wrangler deploy
        working-directory: apps/web

  preview:
    # Fork PRs get no secrets, so they never deploy.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ENV: preview
      ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check for CLOUDFLARE_API_TOKEN
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the preview deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v5
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # CLOUDFLARE_ENV=preview selects env.preview at build time (Vite plugin); wrangler then uses the built config.
      - if: steps.token.outputs.present == 'true'
        run: pnpm --filter @rentbuddy/web build
      # `versions upload` needs the Worker to exist. The first run creates it with a plain deploy.
      - name: Create rentbuddy-preview on first use
        if: steps.token.outputs.present == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler deployments list > /dev/null 2>&1 || pnpm exec wrangler deploy
      - name: Upload preview version
        id: upload
        if: steps.token.outputs.present == 'true'
        working-directory: apps/web
        run: |
          pnpm exec wrangler versions upload --preview-alias "$ALIAS" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -oE "https://${ALIAS}-rentbuddy-preview\.[a-z0-9-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then echo "::error::No preview alias URL in wrangler output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** $URL (commit ${GITHUB_SHA::7}, Clerk development instance)"
